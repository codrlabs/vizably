services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      # Backend code imports ../../shared, which from /app resolves to /shared.
      - ./shared:/shared
    environment:
      - NODE_ENV=development
      - PORT=3000
      - FRONTEND_ORIGIN=http://localhost:5173
    stdin_open: true
    tty: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - BACKEND_URL=http://backend:3000
    stdin_open: true
    tty: true
    depends_on:
      - backend
