name: Test

on:
  push:
    branches: [main]
  pull_request:
  # Lets deploy.yml run this exact suite as its gate, so there is one
  # definition of "the tests pass" rather than a copy that can drift.
  workflow_call:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Tests inject a mock browser, so the real one is never launched.
      # Skipping the download keeps CI from fetching ~170MB per run.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches engines.node in the root package.json, so CI runs on the
          # same major that Vercel does.
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
